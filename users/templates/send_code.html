<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отправить SMS-код</title>
</head>
<body>
  <h1>Отправить SMS-код</h1>
  <form id="send-code-form">
    <label>Телефон: <input type="text" id="phone" placeholder="+70000000000" required></label>
    <button type="submit">Отправить код</button>
  </form>
  <pre id="result"></pre>

  <script>
    document.getElementById('send-code-form').addEventListener('submit', async e => {
      e.preventDefault();
      const phone = document.getElementById('phone').value.trim();
      const res = await fetch('/api/auth/send-code/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({phone})
      });
      const text = await res.text();
      document.getElementById('result').textContent =
        `Status: ${res.status}\n\n${text}`;
    });
  </script>
</body>
</html>
